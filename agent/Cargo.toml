[workspace]
resolver = "2"
members = ["crates/core", "crates/sync", "crates/ui", "crates/app"]

[workspace.package]
version = "0.6.2"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
